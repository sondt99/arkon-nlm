version: 2

# Every base image and compose image in this repo is pinned by digest (see Dockerfile,
# frontend/Dockerfile, nginx/Dockerfile, docker-compose.yml). A digest pin only stops silent
# drift — on its own it also stops security patches from ever arriving. Dependabot is the
# other half: it turns each bump into a reviewable pull request instead of a side effect of
# whoever rebuilt last.
#
# Ecosystems deliberately NOT enabled: pip and npm. Backend dependencies are locked in
# uv.lock with explicit security floors in pyproject.toml, and the frontend in
# package-lock.json; opening those to weekly automated PRs on a repo with a 4-job required
# CI suite would produce more noise than it retires. Revisit per-ecosystem, not wholesale.
updates:
  # Backend image + the uv stage it copies from.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [area:infra]
    commit-message:
      prefix: "chore(deps)"
    # Major bumps of a RUNTIME image are not a patch — they are a platform migration, and
    # Dependabot cannot tell the difference. Left unguarded, the first weekly run opened PRs
    # for python 3.12 -> 3.14, node 22 -> 26 and redis 7 -> 8 simultaneously; each of those
    # changes the interpreter or the server the app runs against, and a green CI run only
    # proves the image builds, not that pgvector/asyncpg/arq behave the same on it.
    #
    # Patch and minor still flow through, which is where the security fixes that justify
    # Dependabot actually live. A major is a deliberate piece of work: bump the digest by
    # hand, run the stack, then remove nothing here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [area:infra]
    commit-message:
      prefix: "chore(deps)"
    # Major bumps of a RUNTIME image are not a patch — they are a platform migration, and
    # Dependabot cannot tell the difference. Left unguarded, the first weekly run opened PRs
    # for python 3.12 -> 3.14, node 22 -> 26 and redis 7 -> 8 simultaneously; each of those
    # changes the interpreter or the server the app runs against, and a green CI run only
    # proves the image builds, not that pgvector/asyncpg/arq behave the same on it.
    #
    # Patch and minor still flow through, which is where the security fixes that justify
    # Dependabot actually live. A major is a deliberate piece of work: bump the digest by
    # hand, run the stack, then remove nothing here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The sole ingress for the whole stack. This is the one that was `FROM nginx:alpine` with
  # no version at all.
  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [area:infra]
    commit-message:
      prefix: "chore(deps)"
    # Major bumps of a RUNTIME image are not a patch — they are a platform migration, and
    # Dependabot cannot tell the difference. Left unguarded, the first weekly run opened PRs
    # for python 3.12 -> 3.14, node 22 -> 26 and redis 7 -> 8 simultaneously; each of those
    # changes the interpreter or the server the app runs against, and a green CI run only
    # proves the image builds, not that pgvector/asyncpg/arq behave the same on it.
    #
    # Patch and minor still flow through, which is where the security fixes that justify
    # Dependabot actually live. A major is a deliberate piece of work: bump the digest by
    # hand, run the stack, then remove nothing here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # docker-compose.yml `image:` entries — postgres/pgvector, redis, minio.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [area:infra]
    commit-message:
      prefix: "chore(deps)"
    # Major bumps of a RUNTIME image are not a patch — they are a platform migration, and
    # Dependabot cannot tell the difference. Left unguarded, the first weekly run opened PRs
    # for python 3.12 -> 3.14, node 22 -> 26 and redis 7 -> 8 simultaneously; each of those
    # changes the interpreter or the server the app runs against, and a green CI run only
    # proves the image builds, not that pgvector/asyncpg/arq behave the same on it.
    #
    # Patch and minor still flow through, which is where the security fixes that justify
    # Dependabot actually live. A major is a deliberate piece of work: bump the digest by
    # hand, run the stack, then remove nothing here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions majors ARE left to Dependabot, unlike the runtime images above. A
  # workflow change cannot be verified locally — only by running it on a real runner — and
  # the blast radius of a bad action version is a red CI run, not a production platform
  # change. Branch protection means these still cannot merge without all four jobs passing.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [area:infra]
    commit-message:
      prefix: "chore(ci)"
