name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed? Everything below is gated on this, so a docs-only PR runs no suite at all.
  #
  # Job-level `if:` rather than a workflow-level `paths:` filter, deliberately. A job skipped
  # by `paths:` never reports, so a REQUIRED check stays pending and the PR blocks forever. A
  # job skipped by `if:` reports "skipped", which satisfies the requirement.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      migrations: ${{ steps.f.outputs.migrations }}
      images: ${{ steps.f.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A first push to a branch, or a force-push, gives no usable base: run everything
          # rather than guess. Cheaper to over-run once than to skip a real regression.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ($BASE) — running every suite"
            for k in backend frontend migrations images; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"; echo "$FILES" | sed 's/^/  /'
          # Herestring, not a pipe. `echo "$FILES" | grep -q` looks equivalent but is not:
          # grep -q exits on the first match and closes the pipe, echo takes SIGPIPE, and
          # `set -o pipefail` reports that 141 as the function's status — i.e. "no match"
          # for a pattern that DID match. It only bites once $FILES exceeds the pipe buffer,
          # so every small PR behaved correctly while a ~1,000-file diff (a vendored tree, a
          # bulk rename, a generated-file drop) silently reported every filter false. With
          # `|| true` keeping this job green, all four suites then skipped — and GitHub
          # counts a skipped required check as satisfied, so such a PR could merge having
          # run nothing. A herestring has no reader to close early.
          m() { grep -qE "$1" <<<"$FILES"; }
          # The workflow itself and the lockfile affect every suite.
          COMMON='^(\.github/workflows/|pyproject\.toml|uv\.lock)'
          m "$COMMON" && { for k in backend frontend migrations images; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          m '^(app/|tests/|alembic/)'            && echo "backend=true"    >> "$GITHUB_OUTPUT" || true
          m '^frontend/'                          && echo "frontend=true"   >> "$GITHUB_OUTPUT" || true
          # tests/test_real_postgres.py is included because the real-database tier RUNS as a
          # step on the migrations job. Without it, a PR that only edits those tests skips the
          # only job that can execute them — which happened on #137: it added three tests to
          # that file and CI reported Migrations=SKIPPED.
          m '^(alembic/|app/database/|app/config|tests/test_real_postgres\.py|tests/conftest\.py)' \
                                                  && echo "migrations=true" >> "$GITHUB_OUTPUT" || true
          m '^(Dockerfile|frontend/Dockerfile|nginx/|docker-compose|entrypoint|migrate\.sh)' \
                                                  && echo "images=true"     >> "$GITHUB_OUTPUT" || true

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches Dockerfile's python:3.12-slim so CI and the image agree.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.21"
          # Without this every run re-downloads the entire locked graph.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `pip install -e ".[dev]"` resolved FRESH and ignored uv.lock, so CI tested a
      # different dependency graph than the image ships — Dockerfile installs from the
      # lockfile via `uv export --locked`. It also silently ignored `[tool.uv]
      # override-dependencies`, which is how the pillow security upgrade passed locally
      # under uv and then failed here with ResolutionImpossible.
      #
      # `--locked`, not `--frozen`, is the flag that asserts uv.lock is in sync with
      # pyproject.toml. `--frozen` only means "do not re-lock", so it installs a stale
      # lockfile without complaint — which is how the v0.2.0 bump in #150 landed without
      # relocking and rode green CI for months, until a Dependabot PR (#160) regenerated
      # the lock and the drift finally surfaced in its diff.
      - name: Install
        run: uv sync --locked --extra dev

      # `pip install -e` put ruff/pytest/alembic on PATH; `uv sync` puts them in .venv/bin.
      # Exporting it here keeps every later step a bare command, as documented in
      # COMMANDS.md, instead of prefixing each one with `uv run`.
      - name: Put the venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Whole repo, not just app/ and tests/. The narrower command that CONTRIBUTING.md
      # used to document reported success while 17 real errors sat in dedup.py and
      # docs/export_docs.py.
      #
      # `ruff format --check` is deliberately NOT run here: the formatter has never been
      # applied to this repo and would reformat 100 of 169 files. Adopting it belongs in
      # its own commit, or every future diff is buried under it.
      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend — lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Matches frontend/Dockerfile's node:22-alpine.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `next build` reported "No build cache found" on every run and rebuilt from scratch.
      # Keyed on the lockfile plus the commit so a rebuild starts from the nearest ancestor
      # rather than nothing.
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('frontend/package-lock.json') }}-
            next-

      - name: Install
        run: npm ci

      # eslint currently reports 84 errors, dominated by react-hooks/set-state-in-effect
      # (51) — which is not style debt but the actual state-race class behind the filed
      # frontend bugs. A plain `npm run lint` would fail on arrival; marking it
      # continue-on-error would mean nobody ever looks at it.
      #
      # So it is a ratchet: the count may only go down. Baseline in
      # frontend/.eslint-baseline.json. When it reaches 0, replace this with
      # `run: npm run lint` and delete the baseline file.
      - name: Lint (ratchet — count may not increase)
        run: |
          npx eslint . -f json > /tmp/eslint.json || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/eslint.json", "utf8"));
            const base = JSON.parse(
              fs.readFileSync("./.eslint-baseline.json", "utf8")
            ).maxErrors;
            const errors = report.reduce((a, f) => a + f.errorCount, 0);
            const byRule = {};
            for (const f of report)
              for (const m of f.messages)
                if (m.severity === 2)
                  byRule[m.ruleId] = (byRule[m.ruleId] || 0) + 1;
            console.log("eslint errors: %d (baseline %d)", errors, base);
            console.log(JSON.stringify(byRule, null, 1));
            if (errors > base) {
              console.error(
                `::error::eslint errors rose from ${base} to ${errors}. ` +
                "Fix the new ones, or justify raising the baseline."
              );
              process.exit(1);
            }
            if (errors < base) {
              console.log(
                `::notice::eslint errors down to ${errors} — lower maxErrors in ` +
                "frontend/.eslint-baseline.json to lock the improvement in."
              );
            }
          '

      # tsc --noEmit covers every file, not only those reachable from the build graph,
      # which is why it runs in addition to the build below. This one is already clean,
      # so it is a hard gate.
      - name: Typecheck
        run: npm run typecheck

      # Unit tests are a hard gate from the start — unlike lint, there is no backlog to
      # ratchet down. Added with the suite in #63; before that the frontend had no unit
      # test framework at all, which is how the 401 blindness (#68) shipped.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  images:
    needs: changes
    # Runs when it can actually tell you something: on demand, or when a file that feeds an
    # image changed — on a pull request as much as on a push. It stays off pushes and PRs
    # that touch nothing an image is built from, which is still the large majority.
    #
    # A nightly `schedule:` trigger used to run this job unconditionally. Removed: since
    # #155 it runs on every pull request that touches an image input, which is the signal
    # the nightly existed to provide — and it arrives before the merge rather than hours
    # after. The nightly's own record did not justify the cost: three images take ~6.5
    # minutes, more than every other job combined, and on a busy branch the concurrency
    # rule cancelled it mid-build. `workflow_dispatch` remains for an on-demand full build.
    #
    # The pull-request path was excluded until #155, to save the ~6.5 minutes three image
    # builds cost. That bill came due on #151 and #152: both were pure image changes (an
    # nginx base digest, a redis compose pin), and both merged with all four jobs reporting
    # "skipping". `Docker images build` is not one of the three required checks, and the
    # three that are — backend, frontend, migrations — skip themselves via `if:` on an
    # image-only diff, which GitHub counts as satisfying the requirement. So the two PRs
    # where this job was the only thing that could speak merged on no signal at all. It had
    # never run on a pull request even once: 0 of the previous 40 PR runs.
    #
    # Not deleted — it is the only job that builds an image, and it caught the Dockerfile
    # installing the exported lockfile without `--no-deps`, where pip re-resolved and
    # silently discarded the pinned graph. Nothing else in CI can see that.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.images == 'true'
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build-verify all three images so a pip/npm resolution break, or a bad nginx
      # directive, is caught here rather than during a production deploy.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # nginx was previously the one image CI never built, despite being the sole ingress
      # for the whole stack and carrying the config baked in. Its Dockerfile ends in
      # `RUN nginx -t`, so this step is also the config syntax check: a typo in
      # nginx.conf or http-common.conf fails the build here instead of taking the
      # ingress down on deploy.
      - name: Build nginx image (runs nginx -t)
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker-compose.yml already set `images=true` in the change detector, but no step in
      # this job could act on it: postgres, redis and minio are `image:` pins, not
      # Dockerfiles, so the three build steps above never reach them. #152 bumped the redis
      # digest and was verified by nothing — not on the PR, and not on the merge push
      # either. A pin that does not resolve (a typo, or a tag withdrawn from the registry)
      # would first surface as a failed `docker compose up` on the deploy host, with the
      # ingress already down.
      - name: Compose file parses and every pinned image resolves
        run: |
          set -euo pipefail

          # `config` insists .env.docker exists, because every service declares
          # `env_file: [.env.docker]`. The committed example supplies placeholders, which is
          # all a parse needs — and it is removed again immediately, since a leftover
          # placeholder file is the exact footgun COMMANDS.md warns about.
          cp .env.docker.example .env.docker
          trap 'rm -f .env.docker' EXIT
          docker compose --env-file .env.docker config -q

          # arkon-backend / arkon-frontend / arkon-nginx are built by the `build:` stanza
          # beside them and have no registry to pin against. Every OTHER image is
          # third-party and must carry a digest, or dependabot.yml's whole premise — that
          # bumps arrive as reviewable PRs rather than as silent drift — is void.
          UNPINNED=$(grep -nE '^[[:space:]]+image: ' docker-compose.yml \
                       | grep -v '@sha256:' | grep -v 'image: arkon-' || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Third-party compose image is not digest-pinned:"
            echo "$UNPINNED"
            exit 1
          fi

          grep -oE '[^ ]+@sha256:[0-9a-f]{64}' docker-compose.yml | sort -u | while read -r ref; do
            echo "resolving $ref"
            docker manifest inspect "$ref" > /dev/null
          done

  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    name: Migrations apply and reverse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arkon
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: arkon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arkon -d arkon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARKON_ALLOW_DEFAULT_SECRET: "1"
      DATABASE_URL: postgresql+asyncpg://arkon:ci_test_password@localhost:5432/arkon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.21"
          # Without this every run re-downloads the entire locked graph.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `pip install -e ".[dev]"` resolved FRESH and ignored uv.lock, so CI tested a
      # different dependency graph than the image ships — Dockerfile installs from the
      # lockfile via `uv export --locked`. It also silently ignored `[tool.uv]
      # override-dependencies`, which is how the pillow security upgrade passed locally
      # under uv and then failed here with ResolutionImpossible.
      #
      # `--locked`, not `--frozen`, is the flag that asserts uv.lock is in sync with
      # pyproject.toml. `--frozen` only means "do not re-lock", so it installs a stale
      # lockfile without complaint — which is how the v0.2.0 bump in #150 landed without
      # relocking and rode green CI for months, until a Dependabot PR (#160) regenerated
      # the lock and the drift finally surfaced in its diff.
      - name: Install
        run: uv sync --locked --extra dev

      # `pip install -e` put ruff/pytest/alembic on PATH; `uv sync` puts them in .venv/bin.
      # Exporting it here keeps every later step a bare command, as documented in
      # COMMANDS.md, instead of prefixing each one with `uv run`.
      - name: Put the venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Enable pgvector
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U arkon -d arkon \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Upgrade to head
        run: alembic upgrade head

      # Migration 018 shipped a downgrade that could not run at all — it rebuilt an index
      # on a column 015 had dropped, and called drop_constraint(None). Nothing caught it
      # because nothing ever ran a downgrade. This step does.
      - name: Reverse the newest migrations and re-apply
        run: |
          alembic downgrade -2
          alembic upgrade head

      # The drift gate below CANNOT see these. `alembic/env.py`'s include_object excludes
      # every reflected index with no metadata counterpart, in both directions — so an
      # index created by raw SQL (all four on wiki_pages, every HNSW vector index, the
      # sources indexes from 034) can be dropped and autogenerate proposes nothing.
      # Dropping `uq_wiki_pages_slug_scope`, the only uniqueness guarantee on
      # wiki_pages.slug, and re-running the drift probe passes cleanly.
      #
      # 41 of the 110 live indexes sit in that blind spot, which is exactly the class of
      # regression migration 018 shipped. A positive existence check is the only thing
      # that catches it, so it runs before the gate that cannot.
      - name: Raw-SQL indexes still exist at head
        env:
          DATABASE_URL: postgresql+asyncpg://arkon:ci_test_password@localhost:5432/arkon
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U arkon -d arkon -At \
            -c "SELECT indexname FROM pg_indexes WHERE schemaname = current_schema();" \
            > /tmp/indexes.txt
          python - <<'PYEOF'
          from app.database.raw_sql_indexes import missing_raw_sql_indexes

          present = {line.strip() for line in open("/tmp/indexes.txt") if line.strip()}
          missing = missing_raw_sql_indexes(present)
          if missing:
              raise SystemExit(
                  "::error::Raw-SQL indexes missing from a database at head: "
                  + ", ".join(missing)
                  + " — these are invisible to autogenerate, so the drift gate below "
                  "will pass regardless."
              )
          print(f"all {len(present)} indexes present, including every raw-SQL one")
          PYEOF

      # Autogenerate against a database at head must propose no *structural* change.
      # This is the gate that would have caught migration 018 dropping four live indexes
      # (including the only uniqueness guarantee on wiki_pages.slug) because they were
      # created with raw SQL and therefore invisible to Base.metadata.
      #
      # Scope note: alter_column is deliberately NOT gated. There are ~20 pre-existing
      # column-attribute drifts — comment text, created_at/updated_at nullability, and the
      # chat_messages.sources JSON-vs-JSONB mismatch — none destructive, all tracked in
      # issue #85. Gating them today would make CI red on arrival, and a permanently red
      # check teaches people to ignore it. Narrow the exclusion as #85 is fixed.
      - name: Fail if models have structurally drifted from migrations
        run: |
          alembic revision --autogenerate -m ci_drift_probe
          PROBE=$(ls -t alembic/versions/*ci_drift_probe*.py | head -1)
          STRUCTURAL='op\.(drop_index|drop_table|drop_column|drop_constraint|create_index|create_table|add_column|create_unique_constraint|create_foreign_key)'
          if grep -qE "^\s+$STRUCTURAL" "$PROBE"; then
            echo "::error::Structural drift between models and migrations. Autogenerate proposed:"
            grep -nE "^\s+$STRUCTURAL" "$PROBE"
            rm -f "$PROBE"
            exit 1
          fi
          rm -f "$PROBE"
          echo "No structural drift."

      # migrate.sh is the only thing that migrates the database now, and its pre-flight is
      # what stops a destructive revision from being applied unattended (issue #41's
      # mechanism). Both halves are asserted, because a guard that silently stopped firing
      # would look exactly like a guard that has nothing to complain about.
      #
      # Runs last: the negative test writes a throwaway revision file, and nothing after it
      # should ever see one.
      - name: Migration guard fires on destructive steps, and only on those
        run: |
          set -euo pipefail

          echo "--- positive: at head, nothing pending, must pass ---"
          ./migrate.sh --check

          echo "--- negative: a pending destructive revision must be refused ---"
          HEAD_REV=$(alembic heads | awk 'NF {print $1; exit}')
          PROBE=alembic/versions/zzz_ci_destructive_probe.py
          cat > "$PROBE" <<PY
          """ci destructive probe

          Revision ID: zzz_ci_destructive_probe
          Revises: ${HEAD_REV}
          """
          from alembic import op

          revision = "zzz_ci_destructive_probe"
          down_revision = "${HEAD_REV}"
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              op.drop_table("employees")


          def downgrade() -> None:
              pass
          PY

          STATUS=0
          ./migrate.sh --check || STATUS=$?
          rm -f "$PROBE"

          if [ "$STATUS" -eq 0 ]; then
            echo "::error::migrate.sh --check passed a revision that drops a table. The"
            echo "::error::pre-flight guard is not working; a destructive migration would"
            echo "::error::now apply unattended on deploy."
            exit 1
          fi
          echo "Guard refused as expected (exit $STATUS)."

      # The real-database tier (#125). Reuses THIS job's Postgres service — a fifth job would
      # need its own container for no extra signal.
      #
      # These tests cannot run in the backend job: `FakeDB` there understands `col == v` and
      # `col.in_([...])` and its own docstring admits `notin_` "filters nothing", so a CHECK
      # violation, a lost update, a MissingGreenlet and a real `LIMIT -1` are all invisible
      # to it. Four shipped bugs proved that. Both mutations were verified to fail here:
      # removing the append_log advisory lock loses an entry, and un-wiring the MCP page
      # guard is caught.
      - name: Real-database tests
        env:
          ARKON_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest tests/test_real_postgres.py -q
