name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Matches Dockerfile's python:3.12-slim so CI and the image agree.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Whole repo, not just app/ and tests/. The narrower command that CONTRIBUTING.md
      # used to document reported success while 17 real errors sat in dedup.py and
      # docs/export_docs.py.
      #
      # `ruff format --check` is deliberately NOT run here: the formatter has never been
      # applied to this repo and would reformat 100 of 169 files. Adopting it belongs in
      # its own commit, or every future diff is buried under it.
      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  frontend:
    name: Frontend — lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Matches frontend/Dockerfile's node:22-alpine.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # eslint currently reports 84 errors, dominated by react-hooks/set-state-in-effect
      # (51) — which is not style debt but the actual state-race class behind the filed
      # frontend bugs. A plain `npm run lint` would fail on arrival; marking it
      # continue-on-error would mean nobody ever looks at it.
      #
      # So it is a ratchet: the count may only go down. Baseline in
      # frontend/.eslint-baseline.json. When it reaches 0, replace this with
      # `run: npm run lint` and delete the baseline file.
      - name: Lint (ratchet — count may not increase)
        run: |
          npx eslint . -f json > /tmp/eslint.json || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/eslint.json", "utf8"));
            const base = JSON.parse(
              fs.readFileSync("./.eslint-baseline.json", "utf8")
            ).maxErrors;
            const errors = report.reduce((a, f) => a + f.errorCount, 0);
            const byRule = {};
            for (const f of report)
              for (const m of f.messages)
                if (m.severity === 2)
                  byRule[m.ruleId] = (byRule[m.ruleId] || 0) + 1;
            console.log("eslint errors: %d (baseline %d)", errors, base);
            console.log(JSON.stringify(byRule, null, 1));
            if (errors > base) {
              console.error(
                `::error::eslint errors rose from ${base} to ${errors}. ` +
                "Fix the new ones, or justify raising the baseline."
              );
              process.exit(1);
            }
            if (errors < base) {
              console.log(
                `::notice::eslint errors down to ${errors} — lower maxErrors in ` +
                "frontend/.eslint-baseline.json to lock the improvement in."
              );
            }
          '

      # tsc --noEmit covers every file, not only those reachable from the build graph,
      # which is why it runs in addition to the build below. This one is already clean,
      # so it is a hard gate.
      - name: Typecheck
        run: npm run typecheck

      # Unit tests are a hard gate from the start — unlike lint, there is no backlog to
      # ratchet down. Added with the suite in #63; before that the frontend had no unit
      # test framework at all, which is how the 401 blindness (#68) shipped.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build-verify all three images so a pip/npm resolution break, or a bad nginx
      # directive, is caught here rather than during a production deploy.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # nginx was previously the one image CI never built, despite being the sole ingress
      # for the whole stack and carrying the config baked in. Its Dockerfile ends in
      # `RUN nginx -t`, so this step is also the config syntax check: a typo in
      # nginx.conf or http-common.conf fails the build here instead of taking the
      # ingress down on deploy.
      - name: Build nginx image (runs nginx -t)
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrations:
    name: Migrations apply and reverse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arkon
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: arkon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arkon -d arkon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARKON_ALLOW_DEFAULT_SECRET: "1"
      DATABASE_URL: postgresql+asyncpg://arkon:ci_test_password@localhost:5432/arkon
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Enable pgvector
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U arkon -d arkon \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Upgrade to head
        run: alembic upgrade head

      # Migration 018 shipped a downgrade that could not run at all — it rebuilt an index
      # on a column 015 had dropped, and called drop_constraint(None). Nothing caught it
      # because nothing ever ran a downgrade. This step does.
      - name: Reverse the newest migrations and re-apply
        run: |
          alembic downgrade -2
          alembic upgrade head

      # Autogenerate against a database at head must propose no *structural* change.
      # This is the gate that would have caught migration 018 dropping four live indexes
      # (including the only uniqueness guarantee on wiki_pages.slug) because they were
      # created with raw SQL and therefore invisible to Base.metadata.
      #
      # Scope note: alter_column is deliberately NOT gated. There are ~20 pre-existing
      # column-attribute drifts — comment text, created_at/updated_at nullability, and the
      # chat_messages.sources JSON-vs-JSONB mismatch — none destructive, all tracked in
      # issue #85. Gating them today would make CI red on arrival, and a permanently red
      # check teaches people to ignore it. Narrow the exclusion as #85 is fixed.
      - name: Fail if models have structurally drifted from migrations
        run: |
          alembic revision --autogenerate -m ci_drift_probe
          PROBE=$(ls -t alembic/versions/*ci_drift_probe*.py | head -1)
          STRUCTURAL='op\.(drop_index|drop_table|drop_column|drop_constraint|create_index|create_table|add_column|create_unique_constraint|create_foreign_key)'
          if grep -qE "^\s+$STRUCTURAL" "$PROBE"; then
            echo "::error::Structural drift between models and migrations. Autogenerate proposed:"
            grep -nE "^\s+$STRUCTURAL" "$PROBE"
            rm -f "$PROBE"
            exit 1
          fi
          rm -f "$PROBE"
          echo "No structural drift."

      # migrate.sh is the only thing that migrates the database now, and its pre-flight is
      # what stops a destructive revision from being applied unattended (issue #41's
      # mechanism). Both halves are asserted, because a guard that silently stopped firing
      # would look exactly like a guard that has nothing to complain about.
      #
      # Runs last: the negative test writes a throwaway revision file, and nothing after it
      # should ever see one.
      - name: Migration guard fires on destructive steps, and only on those
        run: |
          set -euo pipefail

          echo "--- positive: at head, nothing pending, must pass ---"
          ./migrate.sh --check

          echo "--- negative: a pending destructive revision must be refused ---"
          HEAD_REV=$(alembic heads | awk 'NF {print $1; exit}')
          PROBE=alembic/versions/zzz_ci_destructive_probe.py
          cat > "$PROBE" <<PY
          """ci destructive probe

          Revision ID: zzz_ci_destructive_probe
          Revises: ${HEAD_REV}
          """
          from alembic import op

          revision = "zzz_ci_destructive_probe"
          down_revision = "${HEAD_REV}"
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              op.drop_table("employees")


          def downgrade() -> None:
              pass
          PY

          STATUS=0
          ./migrate.sh --check || STATUS=$?
          rm -f "$PROBE"

          if [ "$STATUS" -eq 0 ]; then
            echo "::error::migrate.sh --check passed a revision that drops a table. The"
            echo "::error::pre-flight guard is not working; a destructive migration would"
            echo "::error::now apply unattended on deploy."
            exit 1
          fi
          echo "Guard refused as expected (exit $STATUS)."
