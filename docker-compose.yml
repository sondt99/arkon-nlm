
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Backend image built once, reused by api + workers
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: arkon-backend:latest
  env_file: [.env.docker]
  restart: always
  stop_grace_period: 30s
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=256m
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - temp_uploads:/app/temp_uploads
    - notebooklm_data:/data/notebooklm-session
  networks:
    - backend

services:
  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    # Digest-pinned. `pgvector/pgvector:pg16` is a floating tag: the maintainers re-publish
    # it for every Postgres 16 patch and every pgvector release, so a `docker compose pull`
    # could move the database engine under a live volume with nobody choosing to. Bumps
    # arrive as reviewable Dependabot PRs (.github/dependabot.yml).
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: arkon_postgres
    env_file: [.env.docker]
    restart: always
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.docker.example}
      POSTGRES_DB: ${POSTGRES_DB:-arkon}
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /run/postgresql:size=16m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arkon} -d ${POSTGRES_DB:-arkon}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}
    networks:
      - backend

  redis:
    # Digest-pinned; see the note on postgres above.
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: arkon_redis
    env_file: [.env.docker]
    restart: always
    stop_grace_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — see .env.docker.example}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD must be set} redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-0.5}
    networks:
      - backend

  minio:
    # Already pinned to an immutable RELEASE tag; the digest makes it verifiable as well.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: arkon_minio
    env_file: [.env.docker]
    restart: always
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set — see .env.docker.example}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set — see .env.docker.example}
    volumes:
      - minio_data:/data
    # File access goes through nginx. Uncomment for direct dev access or
    # MinIO console access (port 9003).
    # ports:
    #   - "9002:9000"
    #   - "9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    cpus: ${MINIO_CPUS:-1.0}
    networks:
      - backend

  # ── Schema migration (one-shot) ────────────────────────────────
  # The ONLY thing that migrates the database. Migrations and skill seeding used to live in
  # the shared x-backend entrypoint, so api, worker and worker_skills each ran them on every
  # start and every restart: three unsynchronised writers at boot, `docker compose restart
  # worker` re-migrating production, and — with `restart: always` and `set -e` — a failing
  # migration turning into a crash-loop with no circuit breaker.
  #
  # This service runs once, in one container, with `restart: "no"` so a failure stops and
  # stays stopped where you can read the log. migrate.sh additionally REFUSES to apply a
  # pending revision that drops tables/columns or issues DELETE/TRUNCATE unless
  # ALLOW_DESTRUCTIVE_MIGRATIONS=1 is set — see migrate.sh and DOCKER.md.
  #
  # `docker compose up -d` still migrates automatically (api gates on this service
  # completing), so routine deploys are unchanged. To bring the API up WITHOUT migrating —
  # e.g. to diagnose a failed migration against the old schema:
  #   docker compose --env-file .env.docker up -d --no-deps api
  migrate:
    <<: *backend
    container_name: arkon_migrate
    command: ["./migrate.sh"]
    # Must override the anchor's `restart: always`. A one-shot that exits 0 and gets
    # restarted forever is exactly the loop this change removes.
    restart: "no"
    stop_grace_period: 60s
    mem_limit: ${MIGRATE_MEM_LIMIT:-1g}
    cpus: ${MIGRATE_CPUS:-1.0}

  # ── Application ───────────────────────────────────────────────

  api:
    <<: *backend
    container_name: arkon_api
    networks:
      - frontend
      - backend
    # YAML merge keys replace wholesale, so the anchor's infrastructure conditions are
    # repeated here alongside the migrate gate.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Access via nginx on port 80. Uncomment for direct dev access.
    # ports:
    #   - "5055:5055"
    # --proxy-headers so rate limiting sees the real client IP from nginx's
    # X-Forwarded-For (the API port is not published; nginx is the only ingress).
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 5055 --proxy-headers --forwarded-allow-ips "*"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5055/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${API_MEM_LIMIT:-2g}
    cpus: ${API_CPUS:-2.0}

  worker:
    <<: *backend
    container_name: arkon_worker
    command: python -m arq app.worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
    # job_completion_wait=300s on WorkerSettings lets an in-flight job finish
    # before arq cancels it on SIGTERM; grace period must cover that + buffer.
    stop_grace_period: 330s
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: ${WORKER_MEM_LIMIT:-3g}
    cpus: ${WORKER_CPUS:-2.0}

  worker_skills:
    <<: *backend
    container_name: arkon_worker_skills
    command: python -m arq app.worker.SkillWorkerSettings
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 330s
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "app.worker.SkillWorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: ${WORKER_SKILLS_MEM_LIMIT:-1g}
    cpus: ${WORKER_SKILLS_CPUS:-1.0}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        INTERNAL_API_URL: http://api:5055
    image: arkon-frontend:latest
    container_name: arkon_frontend
    restart: always
    stop_grace_period: 15s
    logging: *default-logging
    # Port exposed via nginx below — no direct host mapping needed.
    # ports:
    #   - "3119:3000"
    environment:
      - INTERNAL_API_URL=http://api:5055
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=256m
    mem_limit: ${FRONTEND_MEM_LIMIT:-1g}
    cpus: ${FRONTEND_CPUS:-1.0}
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  # Single entry point for all traffic. Routes:
  #   /api/*         → api:5055          (backend, no size limit)
  #   /arkon-files/* → minio:9000        (presigned file URLs — must match MINIO_BUCKET)
  #   /*             → frontend:3000     (Next.js)
  #
  # For HTTPS: terminate SSL at your server's nginx/Caddy and forward to this
  # container on port 80. Then set MINIO_SECURE=true in .env.docker so
  # presigned URLs use https://.
  nginx:
    build:
      context: ./nginx
    image: arkon-nginx:latest
    container_name: arkon_nginx
    restart: always
    stop_grace_period: 15s
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
      - /var/cache/nginx:size=128m
    ports:
      - "127.0.0.1:${NGINX_PORT:-3119}:80"
    depends_on:
      - frontend
      - api
      - minio
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    cpus: ${NGINX_CPUS:-0.5}
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
      - npm

# Persistent data lives in Docker NAMED VOLUMES (Docker VM disk), NOT E: bind
# mounts. E: is a spinning HDD whose mount into the Docker VM keeps dropping
# ("No such device"/SIGBUS) even with disk-never-off — named volumes are immune.
# To place this data on E:, move Docker Desktop's disk-image location to E:.
volumes:
  postgres_data:
  redis_data:
  minio_data:
  notebooklm_data:
  temp_uploads:

networks:
  frontend:
  backend:
  # Shared with the LAN nginx-proxy-manager, which proxies arkon.ladybug.net to
  # http://arkon_nginx:80 by container name. NPM lives on this pre-existing
  # network; without joining it, a recreated arkon_nginx is invisible to NPM
  # and every request through the domain returns 502 (localhost:3119 still
  # works, which makes the breakage easy to miss). Declared external so compose
  # only joins it and never creates/removes it.
  npm:
    external: true
    name: arkon_default
