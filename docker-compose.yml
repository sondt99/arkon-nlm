
# Backend image built once, reused by api + workers
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: arkon-backend:latest
  user: root
  env_file: [.env.docker]
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - ./temp_uploads:/app/temp_uploads
    - ./data/notebooklm-session:/data/notebooklm-session

services:
  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: arkon_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-arkon}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arkon} -d ${POSTGRES_DB:-arkon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arkon_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-arkon_secret}
    volumes:
      - ./data/redis:/data
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-arkon_secret} ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: arkon_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - ./data/minio:/data
    # File access goes through nginx. Uncomment for direct dev access or
    # MinIO console access (port 9003).
    # ports:
    #   - "9002:9000"
    #   - "9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Application ───────────────────────────────────────────────

  api:
    <<: *backend
    container_name: arkon_api
    # Access via nginx on port 80. Uncomment for direct dev access.
    # ports:
    #   - "5055:5055"
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 5055
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5055/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    container_name: arkon_worker
    command: python -m arq app.worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy

  worker_skills:
    <<: *backend
    container_name: arkon_worker_skills
    command: python -m arq app.worker.SkillWorkerSettings
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        INTERNAL_API_URL: http://api:5055
    image: arkon-frontend:latest
    container_name: arkon_frontend
    restart: always
    ports:
      - "3119:3000"
    environment:
      - INTERNAL_API_URL=http://api:5055
    depends_on:
      api:
        condition: service_healthy

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  # Single entry point for all traffic. Routes:
  #   /api/*         → api:5055          (backend, no size limit)
  #   /arkon-files/* → minio:9000        (presigned file URLs — must match MINIO_BUCKET)
  #   /*             → frontend:3000     (Next.js)
  #
  # For HTTPS: terminate SSL at your server's nginx/Caddy and forward to this
  # container on port 80. Then set MINIO_SECURE=true in .env.docker so
  # presigned URLs use https://.
  nginx:
    image: nginx:alpine
    container_name: arkon_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
      - minio

# All persistent data stored in ./data/ (relative to this file = project root).
# To use a different location, create a docker-compose.override.yml:
#   services:
#     postgres:
#       volumes:
#         - /your/custom/path/postgres:/var/lib/postgresql/data
