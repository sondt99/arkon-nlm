# http-block directives shared by every server block. Dropped into conf.d as
# 00-http-common.conf so it is included before nginx.conf — `limit_req_zone` and `map` are
# only valid at http level and must be defined before the server block that uses them.
#
# Was rate-limit.conf; renamed when the connection-upgrade map moved in, because a file
# holding both was no longer a rate-limit config.

# ── Rate-limit zones ───────────────────────────────────────────────────────────
# Login: strict, to blunt brute force.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# General API: generous, to blunt abuse.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Next.js frontend. A single page load pulls dozens of JS chunks, fonts and images, so this
# ceiling sits far above the API's — it is here to cap scrapers and floods, not to shape
# normal browsing. Before this zone existed, `location /` was the one route on the whole
# proxy with no limit_req at all, so the cheapest way to load the stack was to request
# pages rather than APIs.
limit_req_zone $binary_remote_addr zone=web:10m rate=100r/s;
# Presigned MinIO object reads (/arkon-files/). Also previously unmetered, and it is the
# route that streams the largest responses.
limit_req_zone $binary_remote_addr zone=files:10m rate=50r/s;

# ── Conditional connection upgrade ─────────────────────────────────────────────
# `location /` used to hardcode `proxy_set_header Connection "upgrade"`, so every ordinary
# HTTP request to the frontend carried `Connection: upgrade` alongside an empty `Upgrade`
# header — a malformed pair that defeats upstream keepalive and invites middlebox rejection.
# The standard map sends `upgrade` only when the client actually asked for one, and `close`
# otherwise.
#
# Production Next.js (`node server.js`) needs no WebSocket; only `next dev` HMR does. The map
# is kept rather than dropping upgrade support outright so that proxying a dev server through
# this config still works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
