server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so upstream IPs are re-resolved after container
    # restarts instead of being cached from startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Do not advertise the nginx version in every response and error page.
    server_tokens off;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options "nosniff"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # TLS is terminated by the proxy in front of this container, so HSTS is set here to
    # travel with the response. Harmless over plain HTTP (browsers ignore it on
    # non-secure origins) and correct once TLS is in front.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Enforced CSP — the directives that cannot break this app.
    #
    # object-src/base-uri/frame-ancestors are the ones with real teeth here and no
    # compatibility cost. script-src is deliberately NOT enforced yet: layout.tsx ships an
    # inline theme script and Next.js injects its own per-build inline hydration scripts,
    # so a strict script-src needs nonce plumbing through the framework. The Report-Only
    # header below surfaces exactly what a strict policy would break, without breaking it.
    #
    # Note for whoever tightens this: script-src 'self' would NOT have stopped the
    # stored-XSS path in issue #56, because MinIO is proxied on this same origin, so the
    # payload counts as 'self'. That one is fixed at the source instead — wiki_images now
    # serves only an allowlisted raster Content-Type.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # ── API backend ─────────────────────────────────────────────────────────
    # X-Forwarded-For is OVERWRITTEN with $remote_addr (not $proxy_add_x_forwarded_for):
    # nginx is the sole ingress, and uvicorn (--proxy-headers) trusts the leftmost
    # entry — appending would let clients spoof their IP past the login rate limit.
    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        set $upstream_api http://api:5055;
        proxy_pass         $upstream_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        set $upstream_api http://api:5055;
        proxy_pass         $upstream_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Sits just above the app's own MAX_REQUEST_BODY_MB (256m) so an oversized upload is
        # refused at the edge rather than buffered to disk here and proxied only for the API
        # to answer 413. The headroom covers multipart framing. Raise this if you raise
        # MAX_REQUEST_BODY_MB — nginx wins, and setting it lower produces nginx's own 413
        # HTML instead of the API's JSON error shape.
        client_max_body_size 260m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # ── MCP server ───────────────────────────────────────────────────────────
    # FastMCP is mounted at /mcp in app/main.py, but without this block the
    # path fell through to the Next.js frontend and every MCP client got a 404
    # — the Claude Desktop/Code integration was unreachable in the deployed
    # stack. Streamable HTTP keeps a long-lived response open, so buffering is
    # off and timeouts are generous; auth is the bearer token checked upstream.
    location /mcp {
        limit_req zone=api burst=60 nodelay;
        set $upstream_api http://api:5055;
        proxy_pass         $upstream_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # ── MinIO object storage ─────────────────────────────────────────────────
    location /arkon-files/ {
        set $upstream_minio http://minio:9000;
        proxy_pass         $upstream_minio;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    # ── Next.js frontend ─────────────────────────────────────────────────────
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
