upstream frontend_up { server frontend:3000; }
upstream api_up      { server api:5055; }
upstream minio_up    { server minio:9000; }

server {
    listen 80;
    server_name _;

    # ── API backend ─────────────────────────────────────────────────────────
    # Route /api/ directly to the backend — bypasses Next.js and has no body
    # size limit, so large file uploads work correctly.
    location /api/ {
        proxy_pass         http://api_up;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # ── MinIO object storage ─────────────────────────────────────────────────
    # Presigned download/preview URLs are generated as:
    #   http(s)://MINIO_PUBLIC_ENDPOINT/MINIO_BUCKET/object-key?X-Amz-...
    # This location catches those paths and forwards them to MinIO.
    # IMPORTANT: the path prefix here must match MINIO_BUCKET in .env.docker.
    location /arkon-files/ {
        proxy_pass         http://minio_up;
        proxy_set_header   Host $host;
        proxy_buffering    off;
    }

    # ── Next.js frontend ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend_up;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
