[project]
name = "arkon"
version = "0.1.0"
description = "Enterprise AI Control Center — Knowledge Base & Skill Management for Claude"
authors = [
    {name = "Arkon Team"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    # AI / LLM (provider-agnostic — user picks at runtime)
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    # MCP Server
    "fastmcp>=2.0.0",
    # Auth
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    # Content processing
    "content-core>=1.14.1,<2",
    # Image extraction
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    # Storage
    "minio>=7.2.0",
    # Utilities
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    # Worker queue
    "arq>=0.26",
    "redis[hiredis]>=5.0",
    # NotebookLM integration. The [headless] extra adds gpsoauth for master-token
    # auth (ADR-0023): mint web cookies server-side from a durable master token, so
    # a headless deploy survives cookie expiry without a per-session browser and
    # without replaying DBSC-bound browser cookies (which Google refuses server-side).
    "notebooklm-py[markdown,headless]>=0.8.1",
    # Security
    "cryptography>=50.0",       # PYSEC-2026-3552
    "mammoth>=1.12.0",
    # Security floors for transitive deps (pulled in via content-core etc.)
    "aiohttp>=3.14.3",          # PYSEC-2026-3545/3546/3547
    "pyasn1>=0.6.4",            # PYSEC-2026-3455/3456/3457
    "pillow>=12.3.0",           # 13 high + 5 moderate advisories; see [tool.uv] below
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "postgres: needs a real Postgres; skipped unless ARKON_TEST_DATABASE_URL or the compose database is reachable",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]


[tool.uv]
# moviepy 2.2.1 (the latest release) declares `pillow<12.0,>=9.2.0`, and it is a HARD
# dependency of content-core, not an extra. That pin was holding pillow at 11.3.0 with 13
# high and 5 moderate advisories open — several of them heap out-of-bounds writes in image
# parsing (`Image.paste`, PSD tile extents, GD dimensions, PCF/BDF font files).
#
# Those are reachable here, not theoretical: `kb_service._extract_text_from_file` hands
# UPLOADED files to `content_core.content.extraction.extract_content`, and content-core
# pulls pillow directly as well as through python-pptx. An authenticated user with
# `doc:create` chooses the bytes that get parsed.
#
# The pin turns out to be conservative rather than required. Verified in an isolated venv
# with pillow 12.3.0 + moviepy 2.2.1:
#   - `import content_core.content.extraction` succeeds. This matters because content-core
#     imports moviepy EAGERLY, so an incompatibility would take down the whole extraction
#     path rather than only video.
#   - moviepy's own image path still works (ImageClip -> get_frame round-trip).
#   - The pillow operations content-core and python-pptx actually use (new / paste / save)
#     all work.
#
# Arkon also never exercises moviepy's video code: `zip_service.ALLOWED_EXTENSIONS` is
# {.pdf .docx .doc .txt .md .csv .xlsx .pptx} — no video format is accepted at any upload
# entry point.
#
# Revisit when moviepy relaxes the pin; then this override can be deleted rather than
# widened.
override-dependencies = ["pillow>=12.3.0"]
